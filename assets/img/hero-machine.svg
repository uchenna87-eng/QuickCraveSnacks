  <rect x="240" y="96" width="34" height="46" rx="4" fill="#21D19F"/>
  <text x="257" y="124" font-family="Space Mono, monospace" font-size="9" fill="#04231B" text-anchor="middle">$0.00</text>
  <g fill="none" stroke="#565B66" stroke-width="1.4">
