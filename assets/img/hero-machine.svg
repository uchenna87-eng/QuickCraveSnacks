    <rect x="240" y="178" width="34" height="20" rx="3"/>
    <rect x="240" y="204" width="34" height="20" rx="3"/>
    <rect x="240" y="230" width="34" height="20" rx="3"/>
    <rect x="240" y="256" width="34" height="20" rx="3"/>
    <rect x="240" y="282" width="34" height="20" rx="3"/>
  </g>
  <text x="257" y="166" font-family="Space Mono, monospace" font-size="9" fill="#9AA0AC" text-anchor="middle">A1</text>
  <text x="257" y="192" font-family="Space Mono, monospace" font-size="9" fill="#9AA0AC" text-anchor="middle">B2</text>
  <text x="257" y="218" font-family="Space Mono, monospace" font-size="9" fill="#9AA0AC" text-anchor="middle">C1</text>
  <text x="257" y="244" font-family="Space Mono, monospace" font-size="9" fill="#9AA0AC" text-anchor="middle">C2</text>
  <text x="257" y="270" font-family="Space Mono, monospace" font-size="9" fill="#9AA0AC" text-anchor="middle">D3</text>
  <text x="257" y="296" font-family="Space Mono, monospace" font-size="9" fill="#9AA0AC" text-anchor="middle">D4</text>
  <rect x="240" y="330" width="34" height="60" rx="4" fill="#0B0C0E"/>
  <circle cx="257" cy="345" r="4" fill="#FFCC00"/>

  <!-- dispenser tray -->
  <rect x="36" y="424" width="248" height="60" rx="8" fill="#0E0F13" stroke="#3A3D46" stroke-width="1.5"/>
  <rect x="52" y="440" width="216" height="28" rx="4" fill="#050506"/>

  <!-- base -->
  <rect x="20" y="490" width="280" height="20" rx="6" fill="#08090B"/>
</svg>
