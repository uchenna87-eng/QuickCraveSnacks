<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="heroMachineTitle">
  <title id="heroMachineTitle">Quick Crave Snacks combo vending machine</title>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22242C"/>
      <stop offset="1" stop-color="#101116"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3E4A"/>
      <stop offset="1" stop-color="#181A20"/>
    </linearGradient>
  </defs>

  <!-- cabinet -->
  <rect x="20" y="10" width="280" height="500" rx="18" fill="url(#bodyGrad)" stroke="#3A3D46" stroke-width="2"/>

  <!-- header / brand plate -->
  <rect x="36" y="26" width="248" height="46" rx="8" fill="#0B0C0E"/>
  <path d="M60 34 48 54h9l-4 16 17-22h-9l2-14Z" fill="#FFCC00"/>
  <text x="82" y="55" font-family="Archivo, sans-serif" font-weight="900" font-size="20" fill="#FFCC00">QUICK CRAVE</text>

  <!-- glass front -->
  <rect x="36" y="82" width="184" height="330" rx="8" fill="url(#glassGrad)" stroke="#454955" stroke-width="1.5"/>

  <!-- product rows -->
  <g fill="#FFCC00" opacity=".9">
    <rect x="46" y="94" width="26" height="56" rx="4"/>
    <rect x="76" y="94" width="26" height="56" rx="4"/>
    <rect x="106" y="94" width="26" height="56" rx="4"/>
    <rect x="136" y="94" width="26" height="56" rx="4"/>
    <rect x="166" y="94" width="26" height="56" rx="4"/>
  </g>
  <g fill="#21D19F" opacity=".9">
    <rect x="46" y="158" width="26" height="56" rx="4"/>
    <rect x="76" y="158" width="26" height="56" rx="4"/>
    <rect x="106" y="158" width="26" height="56" rx="4"/>
    <rect x="136" y="158" width="26" height="56" rx="4"/>
    <rect x="166" y="158" width="26" height="56" rx="4"/>
  </g>
  <g fill="#E89C00" opacity=".9">
    <rect x="46" y="222" width="26" height="56" rx="4"/>
    <rect x="76" y="222" width="26" height="56" rx="4"/>
    <rect x="106" y="222" width="26" height="56" rx="4"/>
    <rect x="136" y="222" width="26" height="56" rx="4"/>
    <rect x="166" y="222" width="26" height="56" rx="4"/>
  </g>
  <g fill="#8C93A3" opacity=".55">
    <rect x="46" y="286" width="26" height="56" rx="4"/>
    <rect x="76" y="286" width="26" height="56" rx="4"/>
    <rect x="106" y="286" width="26" height="56" rx="4"/>
    <rect x="136" y="286" width="26" height="56" rx="4"/>
    <rect x="166" y="286" width="26" height="56" rx="4"/>
  </g>
  <!-- coil lines -->
  <g stroke="#0B0C0E" stroke-width="1.5" opacity=".35">
    <path d="M46 100q13 6 26 0M76 100q13 6 26 0M106 100q13 6 26 0M136 100q13 6 26 0M166 100q13 6 26 0"/>
    <path d="M46 164q13 6 26 0M76 164q13 6 26 0M106 164q13 6 26 0M136 164q13 6 26 0M166 164q13 6 26 0"/>
    <path d="M46 228q13 6 26 0M76 228q13 6 26 0M106 228q13 6 26 0M136 228q13 6 26 0M166 228q13 6 26 0"/>
    <path d="M46 292q13 6 26 0M76 292q13 6 26 0M106 292q13 6 26 0M136 292q13 6 26 0M166 292q13 6 26 0"/>
  </g>

